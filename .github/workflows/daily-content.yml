name: Daily Content Generator

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Europe/Madrid'  # 8am hora peninsular, también en verano
  workflow_dispatch:       # permite lanzarlo manualmente desde GitHub

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias de la web
        run: npm ci

      - name: Comprobar escritura de artículos
        run: npm test

      - name: Instalar dependencias Python
        run: pip install openai requests beautifulsoup4 fal-client

      - name: Ejecutar script de contenido
        run: python scripts/generate_content.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_API_KEY }}

      - name: Validar la web antes de guardar el contenido
        run: npm run build

      - name: Commit y push del nuevo contenido
        run: |
          git config user.name "cadiz-is-bot"
          git config user.email "bot@cadiz.is"
          git add src/content/articles/ public/images/articles/ src/data/events.json src/data/bot_state.json public/images/events/
          git diff --staged --quiet || git commit -m "content: auto-update $(date +%Y-%m-%d)"
          git push

      - name: Lanzar deploy
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
